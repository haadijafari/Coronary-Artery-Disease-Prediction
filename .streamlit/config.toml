[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#eef2f6"
textColor = "#1d2733"
borderColor = "#dfe3e8"
linkColor = "#1c5cab"
font = "Lato:https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap, sans-serif"
headingFont = "'Source Serif 4':https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap, serif"
headingFontWeights = [600, 600, 600, 500, 500, 500]
baseRadius = "6px"
showWidgetBorder = true
chartCategoricalColors = ["#2a78d6", "#eb6834"]

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
