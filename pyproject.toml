[project]
name = "heart-disease"
version = "0.1.0"
description = "Predicting coronary artery disease from the UCI Cleveland clinical dataset: data audit, model comparison and a Streamlit app."
readme = "README.md"
authors = [{ name = "Hadi Jafari" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "joblib>=1.6.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "streamlit>=1.66.1",
]

[project.scripts]
heart-train = "heart_disease.train:main"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.5",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[build-system]
requires = ["uv_build>=0.11.14,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "SIM", "C4", "PD", "NPY", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Chart and UI text deliberately uses typographic characters such as ×, −, – and ρ.
"src/heart_disease/plots.py" = ["RUF001"]
"app/*" = ["RUF001"]
"notebooks/*" = ["RUF001"]

[tool.ruff.lint.pep8-naming]
# Allow the scikit-learn convention of a capital X for feature matrices.
extend-ignore-names = ["X", "X_*"]

[tool.ruff.lint.isort]
known-first-party = ["heart_disease"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
