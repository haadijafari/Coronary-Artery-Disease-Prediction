[project]
name = "heart-disease"
version = "0.1.0"
description = "Predicting coronary artery disease from the UCI Cleveland clinical dataset: data audit, model comparison and a Streamlit app."
requires-python = ">=3.12"
dependencies = [
    "joblib>=1.6.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "streamlit>=1.66.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.5",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
